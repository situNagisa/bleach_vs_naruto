function card(m, why){ const g = cat2group[m]; return `<div class="card" style="--c:${g.color};--b:${lighten(g.color)}" onclick="go('${m}')"><b>${mod[m].name}</b><div>${esc(mod[m].q)}</div>${why?`<div class="why">↳ ${esc(why)}</div>`:''}</div>`; }
function renderList(filter){

  const es = ents[cur] || [];

                 : '<div class="empty">没有——这个职责现在塞在别的实体里，迁移时需要新建</div>';

}
